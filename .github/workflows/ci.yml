name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run offline regression suite
        run: uv run pytest -q

      - name: Smoke service entry points
        run: uv run python scripts/start_api.py --help
      - run: uv run python scripts/start_ingest_worker.py --help
